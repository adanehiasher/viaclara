:root{--bg:#fff;--panel:#f5f5f5;--ink:#1d1d1d;--mut:#555;--peach:#ffdcd0;--sal:#ff8a65;--lav:#b7a3d9;--card:#fff;--line:#e5e5e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--panel:#1e1e1e;--ink:#f2f2f2;--mut:#b5b5b5;--peach:#3a2620;--card:#1b1b1b;--line:#333}}
:root[data-theme="dark"]{--bg:#141414;--panel:#1e1e1e;--ink:#f2f2f2;--mut:#b5b5b5;--peach:#3a2620;--card:#1b1b1b;--line:#333}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Roboto,Arial,sans-serif}
h1,h2,h3,.cond{font-family:Anton,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;font-weight:400;letter-spacing:.02em;line-height:1.05;margin:0}
a{color:inherit;text-decoration:none}
.top{background:#1d1d1d;color:#ddd;font-size:12px;padding:6px 24px;display:flex;gap:24px;flex-wrap:wrap}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:24px;padding:10px 24px;background:rgba(20,20,20,.9);backdrop-filter:blur(8px);color:#fff}
.logo{display:flex;align-items:center;gap:10px;font:400 20px Anton,sans-serif;text-transform:uppercase;line-height:1}
nav{display:flex;gap:22px;margin:0 auto;font:400 14px Anton,sans-serif;text-transform:uppercase;letter-spacing:.06em}
nav a{padding:4px 0;border-bottom:2px solid transparent}nav a:hover{border-color:var(--sal)}
.lang{display:flex;border:1px solid #888;border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:5px 13px;font:700 12px Roboto;cursor:pointer}
.lang button[aria-selected="true"]{background:var(--sal);color:#1d1d1d}
.btn{display:inline-block;background:var(--sal);color:#1d1d1d;border:0;padding:12px 26px;font:400 16px Anton,sans-serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-radius:2px}
.btn:hover{filter:brightness(1.07)}

.side{background:var(--panel);padding:56px 7vw;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.side h2{font-size:clamp(32px,4vw,46px)}
.stats{display:flex;gap:40px;flex-wrap:wrap}.stats b{display:block;font:400 34px Anton,sans-serif}
.stats small{display:block;font-weight:700;font-size:13px;max-width:130px;line-height:1.3}
section{padding:72px max(24px,7vw)}
.sec-h{text-align:center;margin-bottom:36px}.sec-h h2{font-size:clamp(30px,4vw,48px)}.sec-h p{color:var(--mut);max-width:620px;margin:10px auto 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);position:relative}
.card .img{height:200px}.card .b{padding:18px}.card h3{font-size:22px;margin-bottom:8px}.card p{margin:0;color:var(--mut);font-size:14px}
